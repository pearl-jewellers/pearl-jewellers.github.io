name: Update gold rate
on:
  schedule:
    - cron: "30 3 * * *"     # 09:00 IST daily (cron is UTC)
    - cron: "30 4 * * *"     # 10:00 IST daily (cron is UTC)
    - cron: "*/10 * * * *"   # best-effort extra refreshes; GitHub throttles/skips these
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-rates.mjs
      - run: |
          git config user.name "rate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update gold rate" && git push)
