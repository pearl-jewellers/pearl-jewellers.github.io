name: Update gold rate
on:
  schedule:
    - cron: "30 3-14 * * *"  # hourly 09:00-20:00 IST (cron is UTC), includes 9am and 10am
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-rates   # a late scheduled run and the dispatcher run won't push at the same time
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-rates.mjs
      - run: |
          git config user.name "rate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update gold rate" && git push)
